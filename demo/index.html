<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@meijie/react-fireworks demo</title>
  <style>
    body { margin: 0; background: #0a0e27; color: #dce6ff; font-family: system-ui, sans-serif; overflow: hidden; }
    .panel {
      position: fixed; top: 16px; left: 16px; z-index: 20; width: 260px;
      background: rgba(16, 24, 56, 0.92); border: 1px solid #2a3a72;
      border-radius: 10px; padding: 14px; font-size: 13px;
    }
    .panel h1 { font-size: 15px; margin: 0 0 10px; color: #7fd4ff; }
    .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
    .row label { flex: 0 0 78px; color: #a9b8dd; }
    .row select, .row input[type=range] { flex: 1; min-width: 0; }
    select, input[type=range] { background: #1b2550; color: #dce6ff; border: 1px solid #33427a; border-radius: 6px; }
    button {
      background: #2f6df6; color: #fff; border: 0; border-radius: 6px;
      padding: 7px 12px; cursor: pointer; font-size: 13px; margin-top: 8px;
    }
    button:hover { background: #4a83ff; }
    .val { color: #7fd4ff; min-width: 32px; text-align: right; }
    .status { margin-top: 10px; font-size: 12px; color: #8fa5d8; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
